<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>OpenPost launch film</title>
		<link rel="icon" href="data:," />
		<style>
			@font-face {
				font-family: 'Geist';
				src: url('/assets/brand/fonts/Geist-Regular.ttf');
				font-weight: 400;
			}
			@font-face {
				font-family: 'Geist';
				src: url('/assets/brand/fonts/Geist-SemiBold.ttf');
				font-weight: 600;
			}
			@font-face {
				font-family: 'Manrope';
				src: url('/assets/brand/fonts/Manrope-Variable.ttf');
				font-weight: 200 800;
			}

			/* Light Dither theme values from packages/ui/src/lib/themes/builtins/dither.ts. */
			:root {
				--paper: #fbf8f4;
				--surface: #ffffff;
				--sunken: #f3eee8;
				--ink: #2b2621;
				--muted: #6b6159;
				--faint: #a0958c;
				--line: #e6ded6;
				--border: #cfc5bc;
				--focal: #9b4214;
				--mark: #b45309;
				--selection: #f6e3d6;
				--green: #1f6b3a;
				--green-soft: #eef5ee;
				--peach: #f6e8e1;
				--peach-line: #e0c5b8;
				--red: #b4231d;
				--amber: #a8650a;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				background: #000;
			}

			#stage {
				position: relative;
				width: 1920px;
				height: 1080px;
				overflow: hidden;
				background: var(--paper);
				color: var(--ink);
				font-family: 'Geist', sans-serif;
				-webkit-font-smoothing: antialiased;
				perspective: 2400px;
			}

			/* Scenes stack by z-index (titles stay on top); each keeps its own perspective. */
			.layer {
				position: absolute;
				inset: 0;
				perspective: 2400px;
				perspective-origin: 960px 540px;
			}
			.world {
				position: absolute;
				inset: 0;
				transform-style: preserve-3d;
			}

			.box {
				position: absolute;
				transform-origin: 50% 50%;
			}

			#glow {
				position: absolute;
				left: 0;
				top: 0;
				width: 480px;
				height: 270px;
				transform: scale(4);
				transform-origin: 0 0;
				image-rendering: pixelated;
			}

			.icon {
				width: 1em;
				height: 1em;
				flex: none;
			}

			.row {
				display: flex;
				align-items: center;
			}

			/* Kinetic titles: one centred line on the title row. */
			.title {
				z-index: 30;
				left: 0;
				width: 1920px;
				text-align: center;
				font-weight: 600;
				font-size: 74px;
				line-height: 1.1;
				letter-spacing: -0.04em;
				white-space: nowrap;
			}
			/* A soft paper band keeps titles readable over moving UI; it fades with the title. */
			.title::before {
				content: '';
				position: absolute;
				left: 0;
				right: 0;
				top: -84px;
				height: 260px;
				z-index: -1;
				opacity: var(--band, 0);
				background: linear-gradient(
					180deg,
					rgb(251 248 244 / 92%) 0%,
					rgb(251 248 244 / 85%) 55%,
					rgb(251 248 244 / 0%) 100%
				);
			}
			.title .word {
				display: inline-block;
				white-space: pre;
			}
			.accent {
				color: var(--mark);
			}

			/* Surfaces in the app's light scheme. */
			.card {
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: 20px;
				box-shadow:
					0 1px 2px rgb(43 38 33 / 6%),
					0 24px 60px rgb(43 38 33 / 12%);
			}
			.pill {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				height: 56px;
				padding: 0 20px 0 10px;
				border-radius: 999px;
				background: var(--surface);
				border: 1px solid var(--line);
				font-size: 23px;
				font-weight: 600;
				white-space: nowrap;
				box-shadow: 0 10px 30px rgb(43 38 33 / 10%);
			}
			.task {
				display: inline-flex;
				align-items: center;
				gap: 14px;
				height: 62px;
				padding: 0 24px 0 18px;
				border-radius: 16px;
				background: var(--surface);
				border: 1px solid var(--line);
				font-size: 24px;
				font-weight: 600;
				white-space: nowrap;
				box-shadow: 0 14px 34px rgb(43 38 33 / 11%);
			}
			.task i {
				width: 22px;
				height: 22px;
				border-radius: 6px;
				border: 2px solid var(--border);
			}
			.tile {
				width: 92px;
				height: 92px;
				flex: none;
				border-radius: 24px;
				background: var(--surface);
				border: 1px solid var(--line);
				display: grid;
				place-items: center;
				box-shadow: 0 16px 40px rgb(43 38 33 / 12%);
			}
			.tile img {
				width: 60px;
				height: 60px;
			}
			.avatar {
				position: relative;
				width: 40px;
				height: 40px;
				flex: none;
			}
			.avatar img:first-child {
				width: 40px;
				height: 40px;
				border-radius: 50%;
			}
			.avatar img:last-child {
				position: absolute;
				right: -5px;
				bottom: -5px;
				width: 20px;
				height: 20px;
				border-radius: 6px;
				box-shadow: 0 0 0 2px var(--surface);
			}
			.button {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 10px;
				height: 52px;
				padding: 0 24px;
				border-radius: 12px;
				font-size: 22px;
				font-weight: 600;
				white-space: nowrap;
				background-size: 8px 100%;
			}
			.button.focal {
				color: #fffaf6;
				background-color: var(--focal);
				background-image: var(--dither-light);
			}
			.button.ink {
				color: var(--paper);
				background-color: var(--ink);
				background-image: var(--dither-light);
			}
			.button.ordinary {
				color: var(--ink);
				background-color: var(--surface);
				border: 1px solid var(--border);
				background-image: var(--dither-dark);
			}
			.muted {
				color: var(--muted);
			}
			.counter {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				color: var(--muted);
				font-size: 20px;
				font-variant-numeric: tabular-nums;
			}
			.badge {
				width: 52px;
				height: 52px;
				border-radius: 14px;
				overflow: hidden;
				box-shadow: 0 10px 24px rgb(43 38 33 / 18%);
			}
			.badge img {
				width: 52px;
				height: 52px;
			}
			.chip-note {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				height: 44px;
				padding: 0 16px;
				border-radius: 999px;
				font-size: 19px;
				font-weight: 600;
				white-space: nowrap;
				background: var(--surface);
				border: 1px solid var(--line);
				box-shadow: 0 10px 28px rgb(43 38 33 / 14%);
			}

			/* The launch image the founder designs (sample product: Lumen). */
			.art {
				position: absolute;
				left: 0;
				top: 0;
				width: 1200px;
				height: 628px;
				transform-origin: 0 0;
				overflow: hidden;
				color: #f4fbff;
				background: radial-gradient(120% 140% at 85% 110%, #3fb7c9 0%, #18607a 38%, #0d2a3f 75%);
			}
			.art .glow {
				position: absolute;
				inset: 0;
				width: 1200px;
				height: 628px;
				image-rendering: pixelated;
			}
			.art .brand {
				position: absolute;
				left: 84px;
				top: 76px;
				display: flex;
				align-items: center;
				gap: 16px;
				font-family: 'Manrope', sans-serif;
				font-weight: 700;
				font-size: 38px;
				letter-spacing: -0.02em;
			}
			.art .brand i {
				width: 44px;
				height: 44px;
				border-radius: 12px;
				background: linear-gradient(135deg, #b8f3ff, #45c3d6);
			}
			.art .headline {
				position: absolute;
				left: 80px;
				top: 180px;
				font-family: 'Manrope', sans-serif;
				font-weight: 800;
				font-size: 136px;
				line-height: 0.92;
				letter-spacing: -0.055em;
				transform-origin: 0 50%;
			}
			.art .tag {
				position: absolute;
				left: 86px;
				top: 470px;
				font-size: 38px;
				font-weight: 600;
				color: rgb(244 251 255 / 82%);
			}
			.art .device {
				position: absolute;
				left: 740px;
				top: 120px;
				width: 380px;
				height: 400px;
				border-radius: 28px;
				background: rgb(255 255 255 / 10%);
				border: 2px solid rgb(255 255 255 / 30%);
				box-shadow: 0 30px 80px rgb(0 0 0 / 30%);
				padding: 28px;
				display: flex;
				flex-direction: column;
				gap: 16px;
			}
			.art .device span {
				display: block;
				height: 18px;
				border-radius: 9px;
				background: rgb(255 255 255 / 55%);
			}
			.art .device b {
				display: flex;
				align-items: center;
				gap: 10px;
				margin-top: auto;
				font-size: 26px;
				font-weight: 600;
			}
			.art .device b em {
				width: 16px;
				height: 16px;
				border-radius: 50%;
				background: #7ef0a8;
				box-shadow: 0 0 18px #7ef0a8;
			}

			.selection {
				position: absolute;
				border: 2px solid #3d8bfd;
			}
			.selection i {
				position: absolute;
				width: 14px;
				height: 14px;
				background: #fff;
				border: 2px solid #3d8bfd;
				border-radius: 3px;
			}

			.layer-row {
				display: flex;
				align-items: center;
				gap: 14px;
				height: 56px;
				padding: 0 16px;
				border-radius: 12px;
				font-size: 21px;
			}
			.swatch {
				width: 40px;
				height: 40px;
				border-radius: 10px;
				border: 2px solid var(--line);
			}
			.track {
				position: absolute;
				height: 62px;
				border-radius: 12px;
				background: var(--sunken);
				border: 1px solid var(--line);
				overflow: hidden;
			}
			.clip {
				position: absolute;
				top: 6px;
				height: 50px;
				border-radius: 9px;
				overflow: hidden;
				font-size: 17px;
				font-weight: 600;
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 0 12px;
				white-space: nowrap;
			}
			.caption-word {
				display: inline-block;
				padding: 4px 12px;
				margin: 0 3px;
				border-radius: 8px;
				background: rgb(0 0 0 / 70%);
				color: #fff;
				font-size: 30px;
				font-weight: 600;
			}

			.status {
				display: inline-flex;
				align-items: center;
				gap: 7px;
				font-weight: 600;
			}
			.status i {
				width: 10px;
				height: 10px;
				border-radius: 50%;
				background: currentColor;
			}
			.cal-chip {
				border-radius: 9px;
				padding: 8px 10px;
				font-size: 16px;
				line-height: 1.3;
				font-weight: 600;
				overflow: hidden;
			}
			.cal-chip .meta {
				display: flex;
				justify-content: space-between;
				align-items: center;
				font-weight: 400;
				margin-top: 4px;
			}

			.stat {
				padding: 26px 30px;
			}
			.stat .k {
				font-size: 21px;
				color: var(--muted);
				display: flex;
				align-items: center;
				gap: 10px;
			}
			.stat .v {
				margin-top: 8px;
				font-size: 58px;
				font-weight: 600;
				letter-spacing: -0.03em;
				font-variant-numeric: tabular-nums;
			}
			.message {
				display: flex;
				gap: 18px;
				padding: 20px 26px;
				align-items: center;
			}
			.message img.mark {
				width: 56px;
				height: 56px;
				border-radius: 14px;
			}
			.message .who {
				font-size: 22px;
				color: var(--muted);
			}
			.message .who b {
				color: var(--ink);
				font-weight: 600;
				margin-right: 8px;
			}
			.message .text {
				font-size: 32px;
				margin-top: 4px;
			}

			.feature {
				display: inline-flex;
				align-items: center;
				gap: 14px;
				height: 96px;
				padding: 0 38px 0 30px;
				border-radius: 999px;
				background: var(--surface);
				border: 1px solid var(--line);
				font-size: 36px;
				font-weight: 600;
				white-space: nowrap;
				box-shadow: 0 12px 30px rgb(43 38 33 / 9%);
			}
			.feature .icon {
				font-size: 40px;
				color: var(--mark);
			}

			.mark path {
				fill: var(--mark);
			}
			.wordmark {
				font-family: 'Manrope', sans-serif;
				font-weight: 600;
				font-size: 148px;
				letter-spacing: -0.045em;
				line-height: 1;
				white-space: nowrap;
			}
			.wordmark span {
				display: inline-block;
			}
			.closing {
				left: 0;
				width: 1920px;
				text-align: center;
				white-space: nowrap;
			}
			.cursor {
				width: 64px;
				height: 64px;
				filter: drop-shadow(0 8px 14px rgb(0 0 0 / 28%));
				transform-origin: 8px 6px;
			}
			.label {
				position: absolute;
				right: 44px;
				bottom: 32px;
				font-size: 17px;
				color: rgb(43 38 33 / 42%);
			}
		</style>
	</head>
	<body>
		<main id="stage" aria-label="OpenPost launch film"></main>
		<script type="module" src="./film.js"></script>
	</body>
</html>
